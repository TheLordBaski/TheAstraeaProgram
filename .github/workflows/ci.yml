name: CI

# On every push to main (and on pull requests): the EditMode tests, then the Windows and Linux players as artifacts.
# Needs the repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD (see Docs/CI.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-tests-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test report
          # The two Celestial Body Lab tests that open an editor window need a display.
          customParameters: -testCategory "!NeedsGraphics"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Player (${{ matrix.targetPlatform }})
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneLinux64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          # Mono, version stamped from git describe, and the player where the action looks for it.
          buildMethod: TAP.EditorTools.BuildScript.CiBuild
          buildName: TAP
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: TAP-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  benchmark:
    name: Benchmark (Linux, no window)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TAP-StandaloneLinux64
          path: player
      - name: Run the benchmark
        # No GPU on the runner: the numbers are the CPU's share of a frame, which is what a regression in the simulation shows in.
        run: |
          chmod +x player/TAP.x86_64
          mkdir -p results
          player/TAP.x86_64 -batchmode -nographics -benchmark -benchmark-out results/benchmark.csv -logFile results/benchmark.log
      - name: Compare with the last baseline
        shell: pwsh
        run: ./tools/ci/compare-benchmark.ps1 -Current results/benchmark.csv -Baseline Docs/benchmarks/linux-ci.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-linux
          path: results
